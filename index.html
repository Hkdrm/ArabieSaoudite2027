<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon Voyage Omra</title>
  <meta name="description" content="Planning, guide de l'Omra, horaires de prière, Qibla et carte pour votre voyage en Arabie saoudite.">
  <meta name="theme-color" content="#06402f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preload" href="fonts/ArefRuqaa-subset.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Écran d'ouverture : CSS en ligne pour s'afficher dès la première image -->
  <style>
    @font-face{font-family:ArefSub;src:url(fonts/ArefRuqaa-subset.woff2) format("woff2");font-display:block}
    body.splash-on{overflow:hidden}
    #splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 50% 38%,#0f7a58 0%,#0a5a42 38%,#06402f 72%,#03281d 100%);color:#f3dc8a;
      transition:opacity .6s ease,transform .6s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
    #splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
    #splash .sp-bg{position:absolute;inset:0;width:100%;height:100%;opacity:.09}
    #splash .sp-in{position:relative;width:min(92vw,560px);text-align:center;padding:0 8px}
    #splash svg.sp-cal{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 14px rgba(230,195,92,.28))}
    #splash svg.orn{width:min(70vw,300px);height:auto;display:block;margin:0 auto;overflow:visible}
    #splash .orn *{fill:none;stroke:#e0b94a;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    #splash .sp-cal text{font-family:ArefSub,serif;font-size:112px}
    .t-line{fill:none;stroke:#f6e7a6;stroke-width:1.5;stroke-linejoin:round}
    .t-fill{fill:url(#spGold)}
    /* état initial (avant démarrage) */
    #splash .orn *{stroke-dasharray:1;stroke-dashoffset:1}
    #splash .t-line{stroke-dasharray:1500;stroke-dashoffset:1500}
    #splash .wipe{transform:translateX(760px)}
    #splash .sp-sub,#splash .sp-name{opacity:0;transform:translateY(8px)}
    /* animations, déclenchées par .go une fois la police chargée */
    #splash.go .orn *{animation:spDraw 1.6s ease-out .1s forwards}
    #splash.go .orn.b *{animation-delay:2.3s}
    #splash.go .t-line{animation:spLine 2.3s ease-in-out .25s forwards,spFade .7s ease 3s forwards}
    #splash.go .wipe{animation:spWipe 2.2s cubic-bezier(.45,.1,.25,1) 1s forwards}
    #splash.go .sp-sub{animation:spUp .9s ease 2.7s forwards}
    #splash.go .sp-name{animation:spUp .9s ease 3.2s forwards}
    @keyframes spDraw{to{stroke-dashoffset:0}}
    @keyframes spLine{to{stroke-dashoffset:0}}
    @keyframes spFade{to{opacity:0}}
    @keyframes spWipe{to{transform:translateX(-140px)}}
    @keyframes spUp{to{opacity:1;transform:none}}
    #splash .sp-sub{margin-top:6px;font:italic 16px/1.4 Georgia,"Times New Roman",serif;letter-spacing:.12em;color:#e8d38a}
    #splash .sp-name{margin-top:16px;font:600 22px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em;color:#fff}
    /* mouvement réduit : affichage direct */
    #splash.static .t-line{display:none}
    #splash.static .wipe{transform:translateX(-140px);animation:none!important}
    #splash.static .sp-sub,#splash.static .sp-name{opacity:1;transform:none;animation:none!important}
    #splash.static .orn *{stroke-dashoffset:0;animation:none!important}
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Écran d'ouverture : calligraphie « Labbayk Allahumma labbayk » -->
  <div id="splash" aria-hidden="true">
    <svg class="sp-bg" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="spPat" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#f3dc8a" stroke-width="1.2"><rect x="22" y="22" width="36" height="36"/><rect x="22" y="22" width="36" height="36" transform="rotate(45 40 40)"/><circle cx="40" cy="40" r="9"/></g></pattern></defs>
      <rect width="100%" height="100%" fill="url(#spPat)"/></svg>
    <div class="sp-in">
      <svg class="orn a" viewBox="0 0 300 40"><line x1="8" y1="20" x2="124" y2="20" pathLength="1"/><line x1="176" y1="20" x2="292" y2="20" pathLength="1"/>
        <rect x="-8" y="-8" width="16" height="16" transform="translate(150 20)" pathLength="1"/><rect x="-8" y="-8" width="16" height="16" transform="translate(150 20) rotate(45)" pathLength="1"/></svg>
      <svg class="sp-cal" viewBox="0 0 720 250" role="img" aria-label="لبيك اللهم لبيك">
        <defs>
          <linearGradient id="spGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbefb4"/><stop offset=".5" stop-color="#e3bd50"/><stop offset="1" stop-color="#b98a1c"/></linearGradient>
          <linearGradient id="spFadeG"><stop offset="0" stop-color="#000"/><stop offset=".14" stop-color="#fff"/></linearGradient>
          <mask id="spMask" maskUnits="userSpaceOnUse" x="0" y="0" width="720" height="250"><rect class="wipe" x="0" y="0" width="900" height="250" fill="url(#spFadeG)"/></mask>
        </defs>
        <text class="t-line" x="360" y="175" text-anchor="middle" direction="rtl">لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ</text>
        <text class="t-fill" x="360" y="175" text-anchor="middle" direction="rtl" mask="url(#spMask)">لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ</text>
      </svg>
      <div class="sp-sub">Labbayk Allahumma labbayk</div>
      <div class="sp-name" id="spName">Mon Voyage Omra</div>
      <svg class="orn b" viewBox="0 0 300 40" style="margin-top:18px"><line x1="8" y1="20" x2="124" y2="20" pathLength="1"/><line x1="176" y1="20" x2="292" y2="20" pathLength="1"/>
        <rect x="-8" y="-8" width="16" height="16" transform="translate(150 20)" pathLength="1"/><rect x="-8" y="-8" width="16" height="16" transform="translate(150 20) rotate(45)" pathLength="1"/></svg>
    </div>
  </div>
  <script>
    (function () {
      var s = document.getElementById('splash'); if (!s) return;
      var seen = false;
      try { seen = sessionStorage.getItem('omra:splash') === '1'; sessionStorage.setItem('omra:splash', '1'); } catch (e) {}
      if (seen) { s.remove(); return; }                                  // une seule fois par ouverture de l'appli
      try { var l = JSON.parse(localStorage.getItem('omra:lang') || '"fr"'); var n = { fr: 'Mon Voyage Omra', en: 'My Umrah Trip', ar: 'رحلتي للعمرة' }[l]; if (n) document.getElementById('spName').textContent = n; } catch (e) {}
      document.body.classList.add('splash-on');
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) s.classList.add('static');
      var done = false;
      function end() { if (done) return; done = true; s.classList.add('out'); setTimeout(function () { s.remove(); document.body.classList.remove('splash-on'); }, 650); }
      s.addEventListener('click', end);
      function start() { s.classList.add('go'); setTimeout(end, reduce ? 1500 : 5200); }
      var ready = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load('100px ArefSub', 'لَبَّيْكَ'), new Promise(function (r) { setTimeout(r, 1500); })]) : Promise.resolve();
      ready.then(start, start);
    })();
  </script>
  <header class="top">
    <div class="brand"><span class="logo">🕋</span><div><h1 id="appName"></h1><small id="tagline"></small></div></div>
    <select id="langSel" aria-label="Language"></select>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="bottom" id="nav"></nav>
  <script src="js/prayer.js"></script>
  <script src="js/places.js"></script>
  <script src="js/data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/trip.js" defer></script>
  <script src="js/sync.js" defer></script>
  <script src="js/refresh.js" defer></script>
</body>
</html>
