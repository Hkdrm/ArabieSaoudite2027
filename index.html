<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon Voyage Omra</title>
  <meta name="description" content="Planning, guide de l'Omra, horaires de prière, Qibla et carte pour votre voyage en Arabie saoudite.">
  <meta name="theme-color" content="#0a1411">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preload" href="fonts/ArefRuqaa-ar.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Écran d'ouverture : CSS en ligne pour s'afficher dès la première image -->
  <style>
    @font-face{font-family:ArefAr;src:url(fonts/ArefRuqaa-ar.woff2) format("woff2");font-display:block}
    body.splash-on{overflow:hidden}
    #splash{position:fixed;inset:0;z-index:1000;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
      background:radial-gradient(ellipse at 50% 50%,#2a3a34 0%,#16221d 38%,#0a1411 75%,#050a08 100%);
      transition:opacity .7s ease}
    #splash.out{opacity:0;pointer-events:none}
    #splash .sp-rays{position:absolute;inset:-35%;opacity:.55;pointer-events:none;
      background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.07) 0 .7deg,transparent .7deg 2.3deg,rgba(255,255,255,.04) 2.3deg 2.7deg,transparent 2.7deg 4.6deg);
      -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 18%,#000 62%);mask-image:radial-gradient(circle at 50% 50%,transparent 18%,#000 62%);
      filter:blur(1.2px);animation:spRays 60s linear infinite}
    #splash .sp-vig{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.55) 14%,transparent 30%),radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.5) 100%)}
    #splash svg.sp-svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(.5);transform-origin:50% 50%}
    #splash .ring{opacity:0}
    #splash .ring text{fill:#f4f1e6}
    #splash .ring.g text{fill:#e9cd7a}
    #splash .kaaba{opacity:0}
    #splash .tawaf{fill:none;stroke:#2b2b2b;stroke-linecap:round;opacity:.65}
    #splash .sp-name{position:absolute;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom));text-align:center;opacity:0;transform:translateY(10px);
      font:600 21px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.05em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
    #splash .sp-name small{display:block;margin-top:6px;font:italic 14px/1.3 Georgia,serif;letter-spacing:.14em;color:#e9cd7a}
    /* animations (déclenchées par .go une fois la police chargée) */
    #splash.go svg.sp-svg{animation:spZoom 2.2s cubic-bezier(.16,.75,.2,1) forwards}
    #splash.go .ring{animation:spIn .9s ease forwards}
    #splash.go .kaaba{animation:spKaaba 1.4s ease .5s forwards}
    #splash.go .tawaf{animation:spTawaf 12s linear infinite}
    #splash.go .sp-name{animation:spUp .9s ease 2.4s forwards}
    #splash.out svg.sp-svg{transform:scale(1.5);transition:transform .8s ease-in}
    @keyframes spZoom{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
    @keyframes spIn{to{opacity:1}}
    @keyframes spKaaba{from{opacity:0}to{opacity:1}}
    @keyframes spTawaf{to{stroke-dashoffset:-180}}
    @keyframes spUp{to{opacity:1;transform:none}}
    @keyframes spRays{to{transform:rotate(360deg)}}
    /* mouvement réduit : image fixe */
    #splash.static svg.sp-svg{animation:none!important;opacity:1;transform:none}
    #splash.static .ring,#splash.static .kaaba,#splash.static .sp-name{animation:none!important;opacity:1;transform:none}
    #splash.static .sp-rays,#splash.static .tawaf{animation:none!important}
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Écran d'ouverture : la Kaaba entourée d'anneaux de calligraphie (Takbir / Talbiya) qui tournent -->
  <div id="splash" aria-hidden="true">
    <div class="sp-rays"></div>
    <svg class="sp-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="kTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf5"/><stop offset="1" stop-color="#d9d5c8"/></linearGradient>
        <linearGradient id="kL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17191b"/><stop offset="1" stop-color="#0a0b0c"/></linearGradient>
        <linearGradient id="kR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24282b"/><stop offset="1" stop-color="#111314"/></linearGradient>
        <linearGradient id="kGold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a9801c"/><stop offset=".5" stop-color="#f0d27a"/><stop offset="1" stop-color="#b88a1e"/></linearGradient>
        <radialGradient id="kFloor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".8" stop-color="#ebe8df"/><stop offset="1" stop-color="#bdb9ad"/></radialGradient>
      </defs>
      <g id="rings"></g>
      <g class="kaaba">
        <ellipse cx="500" cy="590" rx="172" ry="84" fill="url(#kFloor)"/>
        <ellipse class="tawaf" cx="500" cy="590" rx="136" ry="66" stroke-width="5" stroke-dasharray="1 14"/>
        <ellipse class="tawaf" cx="500" cy="590" rx="158" ry="77" stroke-width="4.5" stroke-dasharray="1 11" style="animation-duration:16s"/>
        <ellipse class="tawaf" cx="500" cy="590" rx="114" ry="55" stroke-width="5" stroke-dasharray="1 17" style="animation-duration:9s"/>
        <ellipse cx="518" cy="604" rx="84" ry="22" fill="rgba(0,0,0,.2)"/>
        <polygon points="415,455 500,493 500,598 415,560" fill="url(#kL)"/>
        <polygon points="500,493 585,455 585,560 500,598" fill="url(#kR)"/>
        <polygon points="415,477 500,515 500,531 415,493" fill="url(#kGold)"/>
        <polygon points="500,515 585,477 585,493 500,531" fill="url(#kGold)"/>
        <polygon points="525,531 556,517 556,557 525,571" fill="url(#kGold)"/>
        <polygon points="530,536 551,527 551,553 530,562" fill="#3b2d0c" opacity=".55"/>
        <polygon points="500,417 585,455 500,493 415,455" fill="url(#kTop)"/>
        <polygon points="500,443 514,450 500,457 486,450" fill="#b9b5a8"/>
        <polyline points="415,455 500,493 585,455" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/>
      </g>
    </svg>
    <div class="sp-vig"></div>
    <div class="sp-name" id="spName">Mon Voyage Omra<small>Labbayk Allahumma labbayk</small></div>
  </div>
  <script>
    (function () {
      var s = document.getElementById('splash'); if (!s) return;
      var seen = false;
      try { seen = sessionStorage.getItem('omra:splash') === '1'; sessionStorage.setItem('omra:splash', '1'); } catch (e) {}
      if (seen) { s.remove(); return; }                                  // une seule fois par ouverture de l'appli
      try { var l = JSON.parse(localStorage.getItem('omra:lang') || '"fr"'); var n = { fr: 'Mon Voyage Omra', en: 'My Umrah Trip', ar: 'رحلتي للعمرة' }[l]; if (n) document.getElementById('spName').firstChild.nodeValue = n; } catch (e) {}
      document.body.classList.add('splash-on');
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) s.classList.add('static');
      var done = false;
      function end() { if (done) return; done = true; s.classList.add('out'); setTimeout(function () { s.remove(); document.body.classList.remove('splash-on'); }, 800); }
      s.addEventListener('click', end);

      /* Anneaux de calligraphie : chaque anneau répète une formule jusqu'à boucler exactement sur sa circonférence. */
      var NS = 'http://www.w3.org/2000/svg';
      var UNITS = ['اللَّهُ أَكْبَرُ', 'لَا إِلَٰهَ إِلَّا اللَّهُ', 'وَلِلَّهِ الْحَمْدُ', 'لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ'];
      var GAP = '   ';
      function build() {
        var svg = s.querySelector('svg.sp-svg'), g = svg.querySelector('#rings');
        var probe = document.createElementNS(NS, 'text');
        probe.setAttribute('font-family', 'ArefAr'); probe.setAttribute('font-size', '100'); probe.setAttribute('xml:space', 'preserve'); svg.appendChild(probe);
        var r = 200, N = 8;
        for (var i = 0; i < N; i++) {
          var unit = UNITS[i % UNITS.length] + GAP;
          probe.textContent = unit;
          var w = probe.getComputedTextLength() / 100;                    // largeur de la formule pour une taille de 1
          if (!(w > 0)) w = unit.length * 0.42;
          var C = 2 * Math.PI * r, fs = r * 0.14, k = Math.max(2, Math.round(C / (w * fs)));
          fs = C / (k * w);                                              // ajuste la taille pour boucler pile
          var id = 'ringp' + i;
          var path = document.createElementNS(NS, 'path');
          path.setAttribute('id', id);
          path.setAttribute('d', 'M500,' + (500 - r) + ' a' + r + ',' + r + ' 0 1,1 0,' + (2 * r) + ' a' + r + ',' + r + ' 0 1,1 0,' + (-2 * r));
          path.setAttribute('fill', 'none');
          var ring = document.createElementNS(NS, 'g');
          ring.setAttribute('class', 'ring' + (i % 3 === 1 ? ' g' : ''));
          ring.style.animationDelay = (0.1 + i * 0.16) + 's';
          var rot = document.createElementNS(NS, 'g');
          var an = document.createElementNS(NS, 'animateTransform');
          var dir = i % 2 ? -1 : 1;
          an.setAttribute('attributeName', 'transform'); an.setAttribute('type', 'rotate');
          an.setAttribute('from', '0 500 500'); an.setAttribute('to', (dir * 360) + ' 500 500');
          an.setAttribute('dur', (30 + i * 5) + 's'); an.setAttribute('repeatCount', 'indefinite');
          var text = document.createElementNS(NS, 'text');
          text.setAttribute('font-family', 'ArefAr'); text.setAttribute('font-size', fs.toFixed(2));
          text.setAttribute('xml:space', 'preserve');
          var tp = document.createElementNS(NS, 'textPath');
          tp.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + id); tp.setAttribute('href', '#' + id);
          tp.setAttribute('textLength', C.toFixed(1)); tp.setAttribute('lengthAdjust', 'spacing');
          tp.textContent = new Array(k + 1).join(unit);
          text.appendChild(tp);
          rot.appendChild(path); rot.appendChild(text); if (!reduce) rot.appendChild(an);
          ring.appendChild(rot); g.appendChild(ring);
          r *= 1.26;
        }
        svg.removeChild(probe);
      }
      function start() {
        try { build(); } catch (e) {}
        s.classList.add('go'); setTimeout(end, reduce ? 1600 : 5600);
      }
      var ready = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load('100px ArefAr', 'اللَّهُ أَكْبَرُ'), new Promise(function (r) { setTimeout(r, 1500); })]) : Promise.resolve();
      ready.then(start, start);
    })();
  </script>
  <header class="top">
    <div class="brand"><span class="logo">🕋</span><div><h1 id="appName"></h1><small id="tagline"></small></div></div>

  <main id="view" tabindex="-1"></main>

  <script src="js/data.js"></script>

  <script src="js/app.js" defer></script>
  <script src="js/trip.js" defer></script>
  <script src="js/sync.js" defer></script>
  <script src="js/refresh.js" defer></script>
</body>
</html>
